<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Guestbook</h1>

    <p>
        Posting as "<strong id="current-user"></strong>"
    </p>
    <p id="list-error" role="alert"></p>
    <ul id="guestbook-list"></ul>
    <form action="" id="guestbook-form">
        <label for="name">Name</label>
        <input id="name" type="text" name="name" maxlength="40" autocomplete="off" required />

        <label for="msg">Message</label>
        <textarea id="msg" name="msg" maxlength="280" required></textarea>

        <button type="submit">Post</button>
        <!-- Honeypot: hidden from people, bots fill it in -->
        <div class="hp-field" aria-hidden="true">
            <label for="website">Leave this field empty</label>
            <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
        </div>
    </form>
    <p id="form-error" role="alert"></p>
    <p id="list-error" role="alert"></p>
    <ul id="guestbook-list"></ul>
    <a href="./index.html">Home</a>

    <script src="js/guestbook.js"></script>
</body>

</html>
